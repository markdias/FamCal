<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FamCal Password Reset</title>
<style>
  body {
    background: #f7f7f7;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    margin: 0;
    padding: 0;
    color: #333;
  }

  .container {
    max-width: 480px;
    margin: 30px auto;
    background: #ffffff;
    padding: 24px;
    border-radius: 8px;
    border: 1px solid #e3e3e3;
  }

  h2 {
    color: #d32f2f;
    font-size: 22px;
    margin-top: 0;
    margin-bottom: 12px;
  }

  p {
    line-height: 1.5;
    margin: 12px 0;
  }

  .button {
    display: inline-block;
    background: #d32f2f;
    color: #ffffff;
    padding: 12px 20px;
    text-decoration: none;
    border-radius: 6px;
    font-weight: 600;
    margin-top: 16px;
  }

  .footer {
    text-align: center;
    font-size: 12px;
    color: #777;
    margin-top: 20px;
  }
</style>
</head>
<body>

<div class="container">
  <h2>Reset your password</h2>

  <p>Use the link below to reset your FamCal password.</p>

  <p>
    <a class="button" href="{{ .ConfirmationURL }}">Reset password</a>
  </p>

  <p>FamCal is an iOS calendar that syncs with your device's built in calendars and presents a shared family view.</p>

  <div class="footer">
    If you did not request a password reset, you can ignore this email.
  </div>
</div>

</body>
</html>
